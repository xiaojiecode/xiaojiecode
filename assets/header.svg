<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">IntelliJ IDEA inspired Xiao Jie profile workspace</title>
  <desc id="desc">A complete dark IDE workspace with project tree, editor, tool windows, and terminal</desc>
  <style>
    .ui { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
