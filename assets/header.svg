<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Xiao Jie neon data stream</title>
  <desc id="desc">Animated network console with flowing data packets, scanning line, node telemetry, and active modules</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3a2748" stroke-width="1" opacity=".45" />
    </pattern>
    <filter id="cyanGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="pinkGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <path id="routeA" d="M26 352C135 318 185 380 292 348S487 310 612 348 830 390 976 344" />
    <path id="routeB" d="M26 375C142 410 248 319 382 370S612 409 750 358 895 332 976 378" />
    <clipPath id="viewport"><rect x="0" y="52" width="1000" height="300" /></clipPath>
  </defs>
  <style>
    .ui { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow-a { stroke-dasharray: 9 14; animation: flowA 7s linear infinite; }
    .flow-b { stroke-dasharray: 4 17; animation: flowB 10s linear infinite; }
    .scan { animation: scan 5.5s ease-in-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .blink { animation: blink 1s steps(1) infinite; }
    .flicker { animation: flicker 4.5s steps(1) infinite; }
    @keyframes flowA { to { stroke-dashoffset: -276; } }
    @keyframes flowB { to { stroke-dashoffset: 252; } }
    @keyframes scan { 0%,100% { transform: translateY(0); opacity: 0; } 8%,92% { opacity: .7; } 50% { transform: translateY(292px); opacity: .35; } }
    @keyframes pulse { 0%,100% { opacity: .38; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
    @keyframes flicker { 0%,91%,94%,100% { opacity: 1; } 92%,95% { opacity: .38; } }
    @media (prefers-reduced-motion: reduce) {
      .flow-a, .flow-b, .scan, .pulse, .blink, .flicker { animation: none; }
      .packet { display: none; }
    }
  </style>

  <rect width="1000" height="420" rx="10" fill="#08070d" />
  <rect width="1000" height="420" rx="10" fill="url(#grid)" />
  <rect width="1000" height="52" rx="10" fill="#120e19" />
  <rect y="43" width="1000" height="9" fill="#120e19" />
  <circle cx="24" cy="26" r="6" fill="#f778ba" />
  <circle cx="46" cy="26" r="6" fill="#f2cc60" />
  <circle cx="68" cy="26" r="6" fill="#56d364" />
  <text x="94" y="31" class="mono" font-size="13" fill="#d2a8ff">NET://XIAOJIECODE</text>
  <text x="500" y="31" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">NODE 68491559 · CHANNEL MAIN</text>
  <circle cx="875" cy="26" r="5" fill="#56d364" filter="url(#cyanGlow)" class="pulse" />
  <text x="889" y="31" class="mono" font-size="11" fill="#56d364">STREAM ONLINE</text>
  <path d="M0 52H1000" stroke="#49375d" />

  <g clip-path="url(#viewport)">
    <rect x="0" y="56" width="1000" height="2" fill="#58a6ff" opacity=".55" filter="url(#cyanGlow)" class="scan" />
  </g>

  <path d="M28 92H972" stroke="#49375d" stroke-width="1" class="flow-a" />
  <path d="M28 320H972" stroke="#49375d" stroke-width="1" class="flow-b" />

  <rect x="28" y="78" width="220" height="224" rx="5" fill="#0d0a14" stroke="#49375d" />
  <text x="46" y="103" class="mono" font-size="11" fill="#f778ba">// NODE TELEMETRY</text>
  <path d="M46 115H230" stroke="#49375d" />
  <text x="46" y="143" class="mono" font-size="12" fill="#8b949e">OPERATOR</text>
  <text x="151" y="143" class="mono" font-size="13" fill="#f0f6fc">Xiao Jie</text>
  <text x="46" y="171" class="mono" font-size="12" fill="#8b949e">REPOS</text>
  <text x="151" y="171" class="mono" font-size="18" fill="#79c0ff">20</text>
  <text x="46" y="202" class="mono" font-size="12" fill="#8b949e">STARS</text>
  <text x="151" y="202" class="mono" font-size="18" fill="#f778ba">05</text>
  <text x="46" y="233" class="mono" font-size="12" fill="#8b949e">PRIMARY</text>
  <text x="151" y="233" class="mono" font-size="13" fill="#56d364">GO 33%</text>
  <path d="M46 250H230" stroke="#49375d" />
  <circle cx="51" cy="274" r="4" fill="#56d364" class="pulse" />
  <text x="65" y="278" class="mono" font-size="11" fill="#56d364">BUILDING</text>
  <text x="145" y="278" class="mono" font-size="11" fill="#8b949e">LATENCY 12ms</text>

  <rect x="268" y="78" width="444" height="224" rx="5" fill="#0b0911" stroke="#49375d" />
  <text x="288" y="106" class="mono" font-size="11" fill="#58a6ff">[ NODE 68491559 ]</text>
  <g class="flicker">
    <text x="288" y="161" class="mono" font-size="43" font-weight="700" fill="#79c0ff" filter="url(#cyanGlow)">XIAO JIE</text>
    <text x="288" y="202" class="mono" font-size="28" font-weight="700" fill="#f778ba" filter="url(#pinkGlow)">SYSTEMS BUILDER</text>
  </g>
  <text x="288" y="236" class="mono" font-size="13" fill="#8b949e">GO SYSTEMS · AI WORKFLOWS · DEVELOPER TOOLS</text>
  <path d="M288 253H678" stroke="#49375d" />
  <text x="288" y="279" class="mono" font-size="12" fill="#56d364">$ transmit --channel main</text>
  <rect x="510" y="267" width="7" height="16" fill="#56d364" class="blink" />

  <rect x="732" y="78" width="240" height="224" rx="5" fill="#0d0a14" stroke="#49375d" />
  <text x="750" y="103" class="mono" font-size="11" fill="#f2cc60">// ACTIVE MODULES</text>
  <path d="M750 115H954" stroke="#49375d" />
  <text x="750" y="143" class="mono" font-size="11" fill="#79c0ff">01</text>
  <text x="782" y="143" class="mono" font-size="12" fill="#f0f6fc">agent-tools</text>
  <circle cx="940" cy="139" r="4" fill="#56d364" class="pulse" />
  <text x="750" y="176" class="mono" font-size="11" fill="#79c0ff">02</text>
  <text x="782" y="176" class="mono" font-size="12" fill="#f0f6fc">mono-rbac</text>
  <circle cx="940" cy="172" r="4" fill="#56d364" class="pulse" />
  <text x="750" y="209" class="mono" font-size="11" fill="#79c0ff">03</text>
  <text x="782" y="209" class="mono" font-size="12" fill="#f0f6fc">llm-console</text>
  <circle cx="940" cy="205" r="4" fill="#f2cc60" class="pulse" />
  <text x="750" y="242" class="mono" font-size="11" fill="#79c0ff">04</text>
  <text x="782" y="242" class="mono" font-size="12" fill="#f0f6fc">go-monitor</text>
  <circle cx="940" cy="238" r="4" fill="#56d364" class="pulse" />
  <path d="M750 259H954" stroke="#49375d" />
  <text x="750" y="282" class="mono" font-size="10" fill="#8b949e">4/4 CHANNELS CONNECTED</text>

  <use href="#routeA" fill="none" stroke="#58a6ff" stroke-width="2" opacity=".65" class="flow-a" />
  <use href="#routeB" fill="none" stroke="#f778ba" stroke-width="2" opacity=".55" class="flow-b" />
  <circle r="5" fill="#79c0ff" filter="url(#cyanGlow)" class="packet">
    <animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#routeA" /></animateMotion>
  </circle>
  <circle r="4" fill="#f778ba" filter="url(#pinkGlow)" class="packet">
    <animateMotion dur="7s" begin="-2.8s" repeatCount="indefinite"><mpath href="#routeB" /></animateMotion>
  </circle>
  <circle r="3" fill="#56d364" filter="url(#cyanGlow)" class="packet">
    <animateMotion dur="6.2s" begin="-4.1s" repeatCount="indefinite"><mpath href="#routeA" /></animateMotion>
  </circle>

  <text x="28" y="409" class="mono" font-size="10" fill="#8b949e">RX 128.4 MB/s</text>
  <text x="145" y="409" class="mono" font-size="10" fill="#8b949e">TX 256.8 MB/s</text>
  <text x="500" y="409" text-anchor="middle" class="mono" font-size="10" fill="#d2a8ff">GO :: PYTHON :: VUE :: DOCKER :: AUTOMATION</text>
  <text x="972" y="409" text-anchor="end" class="mono" font-size="10" fill="#56d364">SIGNAL LOCKED</text>
</svg>
