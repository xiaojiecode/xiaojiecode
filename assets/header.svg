    .menu { font-size: 11px; fill: #c9cacc; }
    .small { font-size: 10px; fill: #8f9094; }
    .line { font-size: 14px; }
    .number { fill: #66686d; font-size: 12px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,48% { opacity: 1 } 49%,100% { opacity: 0 } }
  </style>

