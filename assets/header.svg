<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Xiao Jie - building useful software</title>
  <desc id="desc">Animated terminal-inspired profile banner</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" />
      <stop offset="0.5" stop-color="#58a6ff" />
      <stop offset="1" stop-color="#f0883e" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity=".38" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="typing"><rect x="132" y="105" width="0" height="62"><animate attributeName="width" values="0;590;590;0;0" keyTimes="0;.38;.78;.92;1" dur="7s" repeatCount="indefinite" /></rect></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .dash { stroke-dasharray: 10 16; animation: dash 12s linear infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes dash { to { stroke-dashoffset:-312 } }
    @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
  </style>
  <rect width="1000" height="300" rx="12" fill="#0d1117" />
  <rect width="1000" height="300" rx="12" fill="url(#grid)" />
  <path d="M0 250C180 215 250 290 430 252S760 205 1000 252" fill="none" stroke="url(#line)" stroke-width="2" opacity=".45" class="dash" />
  <circle cx="54" cy="40" r="6" fill="#ff7b72" />
  <circle cx="76" cy="40" r="6" fill="#f2cc60" />
  <circle cx="98" cy="40" r="6" fill="#3fb950" />
  <text x="500" y="45" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">~/xiaojiecode</text>
  <path d="M0 66H1000" stroke="#30363d" />
  <text x="52" y="126" class="mono" font-size="22" fill="#3fb950">$</text>
  <text x="82" y="126" class="mono" font-size="22" fill="#c9d1d9">whoami</text>
  <g clip-path="url(#typing)">
    <text x="132" y="177" class="mono" font-size="48" font-weight="700" fill="#f0f6fc">Xiao Jie</text>
    <text x="358" y="177" class="mono" font-size="48" font-weight="700" fill="#58a6ff">/</text>
    <text x="402" y="177" class="mono" font-size="48" font-weight="700" fill="#f0883e">Builder</text>
  </g>
  <rect x="132" y="136" width="4" height="48" rx="2" fill="#3fb950" filter="url(#glow)" class="cursor">
    <animate attributeName="x" values="132;714;714;132;132" keyTimes="0;.38;.78;.92;1" dur="7s" repeatCount="indefinite" />
  </rect>
  <text x="52" y="222" class="mono" font-size="18" fill="#8b949e">Go · AI systems · Developer tools</text>
  <g transform="translate(825 218)">
    <circle cx="0" cy="0" r="5" fill="#3fb950" class="pulse" />
    <text x="16" y="6" class="mono" font-size="14" fill="#8b949e">shipping</text>
  </g>
</svg>
